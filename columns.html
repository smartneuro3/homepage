<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="./assets/favicon-64.png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 검색엔진 대표 주소: www.smartneuro.co.kr -->
<link rel="canonical" href="https://www.smartneuro.co.kr/columns.html">
<script src="./support.js"></script>
<script src="./content.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'NanumSquareNeo'; src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-dEb.woff) format('woff'); font-weight:800; font-display:swap; }
  @font-face { font-family:'NanumSquareNeo'; src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-eHv.woff) format('woff'); font-weight:900; font-display:swap; }
  h1, h2, h3, .serif-head, .display { font-family:'NanumSquareNeo', 'Noto Sans KR', sans-serif !important; letter-spacing:-0.3px; }
  h1 *, h2 * { font-family:inherit !important; }
  body { margin:0; background:oklch(99% 0.004 90); }
  * { box-sizing:border-box; font-family:'Noto Sans KR', sans-serif; word-break:keep-all; overflow-wrap:break-word; }
  h1, h2, .brand-font { font-weight:900; }
  a { color:oklch(50% 0.13 248); text-decoration:none; }
  a:hover { color:oklch(43% 0.13 248); }
  @media (max-width: 860px) {
    .sub-header .brand-logo { height:30px !important; }
    .sub-header .branch-label { font-size:12px !important; padding:3px 7px !important; margin-left:8px !important; }
    .sub-header > a:last-child { padding:8px 12px !important; font-size:13px !important; white-space:nowrap; }
    .content-wrap { padding:32px 24px 64px !important; }
    h1 { font-size:24px !important; }
    .col-grid { grid-template-columns:1fr !important; }
  }
</style>
</helmet>

<div style="color:oklch(24% 0.02 250); line-height:1.6;">
  <header class="sub-header" style="position:sticky; top:0; z-index:100; background:oklch(99% 0.004 90 / 0.96); backdrop-filter:blur(6px); border-bottom:1px solid oklch(89% 0.008 250); display:flex; align-items:center; justify-content:space-between; padding:16px 20px; gap:12px;">
    <a href="./index.html" style="display:flex; align-items:center; gap:2px;">
      <img class="brand-logo" src="./assets/logo-wordmark.svg" alt="삼성스마트신경과 Samsung SMART Neurology Clinic" style="height:46px; width:auto; display:block; flex-shrink:0;">
      <span class="branch-label" style="font-family:\'NanumSquareNeo\',\'Noto Sans KR\',sans-serif; font-size:17px; font-weight:800; color:oklch(99% 0.005 90); background:oklch(52% 0.09 195); padding:4px 10px; border-radius:6px; margin-left:12px; white-space:nowrap;">부산점</span>
    </a>
    <a href="./index.html#reserve" style="background:oklch(50% 0.13 248); color:oklch(99% 0.005 90); padding:12px 22px; border-radius:4px; font-size:16px; font-weight:800;" style-hover="background:oklch(43% 0.13 248);">진료상담</a>
  </header>

  <div class="content-wrap" style="max-width:800px; margin:0 auto; padding:48px 64px 96px;">
    <div style="font-size:13px; color:oklch(48% 0.015 250); margin-bottom:20px;">
      <a href="./index.html#community" style="color:oklch(48% 0.015 250);">공지·건강정보</a> &gt; 원장칼럼
    </div>
    <div style="font-size:14px; font-weight:700; color:oklch(58% 0.09 195); letter-spacing:1px;">COLUMN</div>
    <h1 style="font-size:32px; font-weight:900; margin:12px 0 32px;">원장칼럼</h1>

    <p style="font-size:16px; color:oklch(45% 0.02 250); margin:-16px 0 32px;">진료실에서 자주 받는 질문을 질환별로 정리했습니다.</p>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <h2 style="font-size:22px; font-weight:900; margin:40px 0 16px;">{{ g.name }}</h2>
      <div class="col-grid" style="display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px;">
        <sc-for list="{{ g.posts }}" as="p" hint-placeholder-count="4">
          <a href="./disease.html?d={{ p.slug }}" style="display:flex; gap:14px; align-items:center; padding:12px; background:oklch(99% 0.005 90); border:1px solid oklch(89% 0.008 250); border-radius:8px; color:oklch(24% 0.02 250);" style-hover="border-color:oklch(50% 0.13 248);">
            <div style="width:84px; height:84px; flex-shrink:0; border-radius:6px; overflow:hidden; background:oklch(95% 0.02 248); display:flex; align-items:center; justify-content:center;">
              <sc-if value="{{ p.thumb }}" hint-placeholder-val="{{ true }}"><img src="./assets/photos/{{ p.thumb }}" alt="" loading="lazy" style="width:100%; height:100%; object-fit:cover; display:block;"></sc-if>
              <sc-if value="{{ p.noThumb }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px; font-weight:800; color:oklch(40% 0.1 248); text-align:center; padding:4px;">{{ g.short }}</span></sc-if>
            </div>
            <div style="min-width:0;">
              <div style="font-size:16px; font-weight:800; margin-bottom:4px;">{{ p.title }}</div>
              <div style="font-size:13px; color:oklch(45% 0.02 250); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">{{ p.summary }}</div>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <footer style="padding:32px 64px; background:oklch(96% 0.006 90); border-top:1px solid oklch(89% 0.008 250); text-align:center;">
    <div style="font-size:13px; color:oklch(48% 0.015 250);">삼성스마트신경과 부산점 · 051-558-5898</div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    // 홈페이지의 질환 글(content.js)을 분야별로 모아 보여 줍니다.
    const A = window.SN_ARTICLES || {};
    const order = [
      ['headache', '두통', '두통'], ['dizziness', '어지럼증', '어지럼증'], ['sleep', '수면장애', '수면'],
      ['autonomic', '자율신경장애', '자율신경'], ['peripheral', '말초신경질환', '말초신경'], ['other', '기타 신경질환', '기타'],
    ];
    const groups = order.map(([key, name, short]) => ({
      name, short,
      posts: Object.entries(A)
        .filter(([slug, a]) => a.parent === key)
        .map(([slug, a]) => {
          const img = (a.blocks || []).find(b => b.t === 'img');
          return { slug, title: a.title, summary: a.summary, thumb: img ? img.src : '', noThumb: !img };
        }),
    })).filter(g => g.posts.length);
    return { groups };
  }
}

</script>
</body>
</html>
