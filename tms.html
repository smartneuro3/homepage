<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="./assets/favicon-64.png">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./content.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:'NanumSquareNeo'; src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-dEb.woff) format('woff'); font-weight:800; font-display:swap; }
  @font-face { font-family:'NanumSquareNeo'; src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-eHv.woff) format('woff'); font-weight:900; font-display:swap; }
  h1, h2, h3, .serif-head, .display { font-family:'NanumSquareNeo', 'Noto Sans KR', sans-serif !important; letter-spacing:-0.3px; }
  h1 *, h2 * { font-family:inherit !important; }
  body { margin:0; background:oklch(99% 0.004 90); }
  * { box-sizing:border-box; font-family:'Noto Sans KR', sans-serif; word-break:keep-all; overflow-wrap:break-word; }
  h1, h2, .brand-font { font-weight:900; }
  a { color:oklch(46% 0.13 248); text-decoration:none; }
  a:hover { color:oklch(38% 0.13 248); }
  @media (max-width: 860px) {
    .sub-header .brand-logo { height:30px !important; }
    .sub-header .branch-label { font-size:12px !important; padding:3px 7px !important; margin-left:8px !important; }
    .sub-header > a:last-child { padding:8px 12px !important; font-size:13px !important; white-space:nowrap; }
    .content-wrap { padding:32px 24px 64px !important; }
    .tms-photos { grid-template-columns:1fr !important; }
    .tms-photos > div { height:260px !important; }
    .split-grid { grid-template-columns:1fr !important; }
    .grid-3 { grid-template-columns:1fr !important; }
    .grid-4 { grid-template-columns:1fr 1fr !important; }
    h1 { font-size:24px !important; line-height:1.35 !important; }
    p { font-size:15px !important; line-height:1.7 !important; }
  }
</style>
</helmet>

<div style="color:oklch(24% 0.02 250); line-height:1.6;">

  <header class="sub-header" style="position:sticky; top:0; z-index:100; background:oklch(99% 0.004 90 / 0.96); backdrop-filter:blur(6px); border-bottom:1px solid oklch(89% 0.008 250); display:flex; align-items:center; justify-content:space-between; padding:16px 20px; gap:12px;">
    <a href="./index.html" style="display:flex; align-items:center; gap:2px;">
      <img class="brand-logo" src="./assets/logo-wordmark.svg" alt="삼성스마트신경과 Samsung SMART Neurology Clinic" style="height:46px; width:auto; display:block; flex-shrink:0;">
      <span class="branch-label" style="font-family:\'NanumSquareNeo\',\'Noto Sans KR\',sans-serif; font-size:17px; font-weight:800; color:oklch(99% 0.005 90); background:oklch(52% 0.09 195); padding:4px 10px; border-radius:6px; margin-left:12px; white-space:nowrap;">부산점</span>
    </a>
    <a href="./index.html#reserve" style="background:oklch(46% 0.13 248); color:oklch(99% 0.005 90); padding:12px 22px; border-radius:4px; font-size:16px; font-weight:800;" style-hover="background:oklch(38% 0.13 248);">진료상담</a>
  </header>

  <div class="content-wrap" style="max-width:860px; margin:0 auto; padding:48px 64px 96px;">
    <div style="font-size:13px; color:oklch(48% 0.015 250); margin-bottom:20px;">
      <a href="./index.html#treatment" style="color:oklch(48% 0.015 250);">치료</a> &gt; {{ art.title }}
    </div>
    <div style="font-size:14px; font-weight:700; color:oklch(58% 0.09 195); letter-spacing:1px;">TREATMENT</div>
    <h1 style="font-size:36px; font-weight:900; margin:12px 0 12px; line-height:1.3;">{{ art.title }}</h1>
    <p style="font-size:17px; color:oklch(45% 0.02 250); margin:0 0 24px;">{{ art.summary }}</p>

    <div class="tms-photos" style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
      <div style="height:380px; border-radius:8px; overflow:hidden; background:oklch(94% 0.006 250);"><img src="./assets/photos/treatment-tms.jpg" alt="TMS 코일을 머리에 대고 치료하는 모습" style="width:100%; height:100%; object-fit:cover; object-position:center 55%; display:block;"></div>
      <div style="height:380px; border-radius:8px; overflow:hidden; background:oklch(94% 0.006 250);"><img src="./assets/photos/treatment-tms-room.jpg" alt="TMS 치료실" style="width:100%; height:100%; object-fit:cover; object-position:center 60%; display:block;"></div>
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;">
      <sc-for list="{{ uses }}" as="u" hint-placeholder-count="4">
        <span style="display:inline-block; padding:10px 18px; border-radius:20px; background:oklch(93% 0.045 248); color:oklch(30% 0.12 248); font-size:14px; font-weight:800;">{{ u.name }}</span>
      </sc-for>
    </div>

    <article style="margin-top:8px;">
      <sc-for list="{{ art.blocks }}" as="b" hint-placeholder-count="6">
        <sc-if value="{{ b.isImg }}" hint-placeholder-val="{{ false }}">
          <figure style="margin:20px 0 24px;">
            <a href="./assets/photos/{{ b.src }}" target="_blank" rel="noopener" title="크게 보기" style="display:block; cursor:zoom-in;"><img src="./assets/photos/{{ b.src }}" alt="{{ b.caption }}" loading="lazy" style="display:block; max-width:100%; max-height:620px; width:auto; height:auto; margin:0 auto; border-radius:8px; border:1px solid oklch(89% 0.008 250); background:oklch(99% 0.003 250);"></a>
            <figcaption style="font-size:13px; color:oklch(45% 0.02 250); margin-top:8px; line-height:1.6; text-align:center;">{{ b.caption }}</figcaption>
          </figure>
        </sc-if>
        <sc-if value="{{ b.isH2 }}" hint-placeholder-val="{{ false }}">
          <h2 style="font-size:26px; font-weight:900; line-height:1.4; margin:56px 0 18px; padding-top:22px; border-top:1px solid oklch(91% 0.008 250); color:oklch(26% 0.09 248);">{{ b.text }}</h2>
        </sc-if>
        <sc-if value="{{ b.isH3 }}" hint-placeholder-val="{{ false }}">
          <h3 style="font-size:18px; font-weight:700; line-height:1.5; margin:32px 0 10px; color:oklch(34% 0.1 248);">{{ b.text }}</h3>
        </sc-if>
        <sc-if value="{{ b.isP }}" hint-placeholder-val="{{ true }}">
          <p style="font-size:16px; line-height:1.9; color:oklch(34% 0.02 250); margin:0 0 14px;"><sc-for list="{{ b.segs }}" as="s" hint-placeholder-count="1"><span style="font-weight:{{ s.w }}; color:{{ s.c }}; background:{{ s.bg }};">{{ s.t }}</span></sc-for></p>
        </sc-if>
        <sc-if value="{{ b.isList }}" hint-placeholder-val="{{ false }}">
          <ul style="margin:4px 0 18px; padding-left:22px;">
            <sc-for list="{{ b.items }}" as="it" hint-placeholder-count="3">
              <li style="font-size:16px; line-height:1.8; color:oklch(34% 0.02 250); margin-bottom:8px;"><sc-for list="{{ it.segs }}" as="s" hint-placeholder-count="1"><span style="font-weight:{{ s.w }}; color:{{ s.c }}; background:{{ s.bg }};">{{ s.t }}</span></sc-for></li>
            </sc-for>
          </ul>
        </sc-if>
        <sc-if value="{{ b.isCheck }}" hint-placeholder-val="{{ false }}">
          <div style="background:oklch(96.5% 0.012 248); border:1px solid oklch(90% 0.025 248); border-radius:8px; padding:24px 28px; margin:12px 0 22px;">
            <sc-if value="{{ b.hasTitle }}" hint-placeholder-val="{{ true }}">
              <div style="font-size:15px; font-weight:900; color:oklch(34% 0.13 248); margin-bottom:12px;">{{ b.title }}</div>
            </sc-if>
            <sc-for list="{{ b.items }}" as="it" hint-placeholder-count="3">
              <div style="display:flex; gap:12px; align-items:flex-start; padding:7px 0; font-size:15px; line-height:1.7; color:oklch(30% 0.02 250);">
                <span style="flex-shrink:0; width:22px; height:22px; margin-top:2px; border-radius:50%; background:oklch(46% 0.13 248); color:oklch(99% 0.005 90); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center;">{{ it.n }}</span>
                <span><sc-for list="{{ it.segs }}" as="s" hint-placeholder-count="1"><span style="font-weight:{{ s.w }}; color:{{ s.c }}; background:{{ s.bg }};">{{ s.t }}</span></sc-for></span>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </sc-for>
    </article>

    <div style="margin-top:56px; border-top:1px solid oklch(89% 0.008 250); padding-top:32px;">
      <div style="font-size:18px; font-weight:900; margin-bottom:16px;">관련 클리닉</div>
      <div style="display:flex; flex-wrap:wrap; gap:10px;">
        <sc-for list="{{ clinicsRel }}" as="c" hint-placeholder-count="3">
          <a href="{{ c.href }}" style="display:inline-block; padding:10px 18px; border:1px solid oklch(85% 0.01 250); border-radius:20px; font-size:14px; font-weight:700; color:oklch(30% 0.1 248);">{{ c.name }} &gt;</a>
        </sc-for>
      </div>
    </div>

    <div style="margin-top:48px; background:oklch(96% 0.006 90); border-radius:8px; padding:32px; text-align:center;">
      <div style="font-size:18px; font-weight:900; margin-bottom:8px;">TMS 치료가 맞는지 먼저 상담해 보세요</div>
      <div style="font-size:14px; color:oklch(45% 0.02 250); margin-bottom:20px;">신경과 전문의 3인이 진료합니다 · 051-558-5898</div>
      <a href="./index.html#reserve" style="display:inline-block; background:oklch(46% 0.13 248); color:oklch(99% 0.005 90); padding:14px 36px; border-radius:4px; font-size:16px; font-weight:900;">진료상담 문의하기</a>
    </div>
  </div>

  <footer style="padding:32px 64px; background:oklch(96% 0.006 90); border-top:1px solid oklch(89% 0.008 250); text-align:center;">
    <div style="font-size:13px; color:oklch(48% 0.015 250);">삼성스마트신경과 부산점 · 051-558-5898</div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const A = window.SN_ARTICLES || {};
    const art = window.SN_prepArticle(A.tms);
    if (typeof document !== 'undefined') document.title = art.title + ' | 삼성스마트신경과 부산점';
    return {
      art,
      uses: [
        { name: '자율신경장애', href: './clinic.html?slug=autonomic' },
        { name: '이명', href: './disease.html?d=tinnitus' },
        { name: '두통', href: './clinic.html?slug=headache' },
        { name: '우울증', href: '#' },
      ],
      clinicsRel: [
        { name: '자율신경클리닉', href: './clinic.html?slug=autonomic' },
        { name: '기타 신경질환클리닉(이명)', href: './clinic.html?slug=other' },
        { name: '두통클리닉', href: './clinic.html?slug=headache' },
      ],
    };
  }
}
</script>
</body>
</html>
